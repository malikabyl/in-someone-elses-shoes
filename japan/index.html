<title>In Someone Else's Shoes: Japan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&display=swap">
<style>
/* One passbook column: ledger paper, dotted leader rows, a teletype tape for the news. */
:root {
  --paper: #E9EFE4;
  --card: #F6F9F2;
  --ink: #15231B;
  --muted: #586A5E;
  --line: #C6D2C3;
  --accent: #1D6846;
  --on-accent: #F6F9F2;
  --pos: #1D6846;
  --neg: #AE3A2B;
  --gold: #8F6511;
  --tape: #DCE5D6;
  --font-display: 'IBM Plex Serif', 'Noto Serif JP', Georgia, 'Times New Roman', serif;
  --font-body: 'IBM Plex Sans', 'Noto Sans JP', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-data: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1512; --card: #151E19; --ink: #DCE6DD; --muted: #8FA396; --line: #27352D;
    --accent: #5FC08F; --on-accent: #0B1510; --pos: #5FC08F; --neg: #F0806E; --gold: #DDAF55; --tape: #1B2620;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1512; --card: #151E19; --ink: #DCE6DD; --muted: #8FA396; --line: #27352D;
  --accent: #5FC08F; --on-accent: #0B1510; --pos: #5FC08F; --neg: #F0806E; --gold: #DDAF55; --tape: #1B2620;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
#app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 120px; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .muted { color: var(--muted); }
.eyebrow { font-family: var(--font-data); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* ---------- header ---------- */
.top { display: flex; flex-direction: column; gap: 10px; }
.top-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -.01em; }
.when { font-family: var(--font-data); font-size: 13px; }
.who { color: var(--muted); font-size: 13px; }
.years { display: grid; grid-template-columns: repeat(15, 1fr); gap: 3px; }
.year { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; height: 8px; }
.tick { background: var(--line); }
.tick.done { background: var(--ink); }
.tick.now { background: var(--accent); }

/* ---------- teletype ---------- */
.wire { background: var(--tape); border-left: 3px solid var(--ink); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.wire-head { font-family: var(--font-display); font-size: 18px; line-height: 1.3; font-weight: 500; text-wrap: pretty; }
.moves { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--font-data); font-size: 12.5px; }
.notes { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.note::before { content: '— '; color: var(--muted); }

/* ---------- freedom gauge ---------- */
.free { display: flex; flex-direction: column; gap: 8px; }
.free-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.free-pct { font-family: var(--font-data); font-weight: 600; font-size: 40px; line-height: 1; letter-spacing: -.02em; }
.free-cap { font-size: 13px; color: var(--muted); text-align: right; min-width: 0; }
.bar { height: 14px; background: var(--card); border: 1px solid var(--ink); position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
.bar > i.neg-fill { background: var(--neg); }
.streak { font-size: 13px; }

/* ---------- ledger rows ---------- */
.block { display: flex; flex-direction: column; gap: 8px; }
.block > h2 { font-family: var(--font-data); font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding-bottom: 6px; border-bottom: 1px solid var(--ink); }
.rows { display: flex; flex-direction: column; gap: 5px; }
.row { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.row > span:first-child { min-width: 0; }
.row > .dots { flex: 1 1 12px; border-bottom: 1px dotted var(--muted); transform: translateY(-4px); min-width: 12px; opacity: .6; }
.row > .num { white-space: nowrap; }
.row.sum { padding-top: 6px; border-top: 1px solid var(--line); font-weight: 600; }
.tag { font-family: var(--font-data); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); padding: 0 4px; margin-left: 6px; white-space: nowrap; }

.eco { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.eco div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.eco b { font-family: var(--font-data); font-weight: 600; font-size: 17px; }
.eco span { font-size: 11.5px; color: var(--muted); line-height: 1.2; }
@media (max-width: 380px) { .eco { grid-template-columns: repeat(2, 1fr); } }

/* ---------- assets ---------- */
.asset { background: var(--card); border: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.asset-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.asset-head > div { min-width: 0; }
.asset-name { font-weight: 600; font-size: 16px; }
.asset-price { font-family: var(--font-data); font-size: 13px; color: var(--muted); }
.asset-price b { color: var(--ink); font-weight: 600; }
.spark { flex: 0 0 96px; width: 96px; height: 32px; }
.spark path.l { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.spark path.a { fill: var(--ink); opacity: .08; stroke: none; }
.spark circle { fill: var(--accent); }
.own { font-size: 14px; }
.acts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.acts > span { font-size: 12px; color: var(--muted); flex: 0 0 62px; }
.chip { font-family: var(--font-data); font-size: 13px; background: var(--paper); border: 1px solid var(--ink); padding: 7px 10px; min-height: 36px; cursor: pointer; white-space: nowrap; }
.chip:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
.chip:disabled { border-color: var(--line); color: var(--muted); cursor: default; }
.btn { font-weight: 600; background: var(--accent); color: var(--on-accent); border: 1px solid var(--accent); padding: 10px 14px; min-height: 42px; cursor: pointer; }
.btn:disabled { background: transparent; color: var(--muted); border-color: var(--line); cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--ink); font-weight: 500; }
.why { font-size: 13px; color: var(--neg); }
.hint { font-size: 13px; color: var(--muted); }
.house { border-top: 1px dotted var(--muted); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.locked { font-size: 14px; color: var(--muted); }

/* ---------- bottom dock ---------- */
.dock { position: fixed; left: 0; right: 0; bottom: 0; background: var(--paper); border-top: 1px solid var(--ink); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
.dock-in { max-width: 528px; margin: 0 auto; display: flex; gap: 8px; }
.dock .btn { flex: 1 1 auto; font-size: 16px; min-height: 48px; }
.dock .btn.ghost { flex: 0 0 auto; font-size: 14px; }

/* ---------- start ---------- */
.hero h1 { font-family: var(--font-display); font-weight: 700; font-size: 44px; line-height: 1; letter-spacing: -.02em; text-wrap: balance; }
.hero p { max-width: 60ch; }
.hero { display: flex; flex-direction: column; gap: 12px; }
.rules { display: flex; flex-direction: column; gap: 6px; padding-left: 18px; margin: 0; }
.profs { display: flex; flex-direction: column; }
.prof { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 12px 4px; cursor: pointer; width: 100%; }
.prof:hover { background: var(--card); }
.prof-name { font-weight: 600; font-size: 16px; }
.prof-pay { font-family: var(--font-data); font-size: 14px; text-align: right; white-space: nowrap; }
.prof-note { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.prof-meta { grid-column: 1 / -1; font-family: var(--font-data); font-size: 11.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 12px; }
details { font-size: 13.5px; color: var(--muted); }
details summary { cursor: pointer; color: var(--ink); font-weight: 500; padding-block: 6px; }
details ul { margin: 6px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }

/* ---------- results ---------- */
.verdict h1 { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.05; letter-spacing: -.02em; text-wrap: balance; }
.verdict { display: flex; flex-direction: column; gap: 10px; }
.reveal { font-family: var(--font-data); font-size: 13px; letter-spacing: .04em; }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .zero { stroke: var(--muted); stroke-width: 1; }
.chart text { fill: var(--muted); font-family: var(--font-data); font-size: 16px; }
.chart .real { fill: none; stroke: var(--accent); stroke-width: 2.5; }
.chart .real-a { fill: var(--accent); opacity: .12; stroke: none; }
.chart .nom { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 3; }
.chart .dot { fill: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2.5px solid var(--accent); vertical-align: middle; margin-right: 6px; }
.legend i.n { border-top: 1.5px dashed var(--muted); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); vertical-align: baseline; }
th { font-family: var(--font-data); font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom-color: var(--ink); }
td.num, th.num { text-align: right; padding-right: 0; padding-left: 8px; white-space: nowrap; }
tr.me td { font-weight: 600; }
.timeline { display: flex; flex-direction: column; gap: 8px; }
.timeline div { display: grid; grid-template-columns: 74px 1fr; gap: 8px; font-size: 14px; }
.timeline b { font-family: var(--font-data); font-weight: 500; font-size: 12.5px; color: var(--muted); padding-top: 2px; }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .35s ease; } }
body { margin: 0; }
.lang { display: inline-flex; border: 1px solid var(--ink); }
.lang button { font-family: var(--font-data); font-size: 12px; background: transparent; border: 0; padding: 4px 8px; min-height: 30px; cursor: pointer; color: var(--ink); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.hero-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
:root[lang="ja"] .eyebrow, :root[lang="ja"] .block > h2, :root[lang="ja"] th { letter-spacing: .04em; }
</style>

    { id: 'auto',    age: 18, base: 100000, bonus: 1.00, share: 0.74, sens: 0.60, curve: [[15, 0.023]] },
    { id: 'build',   age: 18, base: 120000, bonus: 0.25, share: 0.78, sens: 1.80, curve: [[10, 0.027]] },
    { id: 'shop',    age: 18, base: 85000,  bonus: 0.20, share: 0.82, sens: 1.50, curve: [[15, 0.010]] },
    { id: 'prog',    age: 22, base: 118500, bonus: 0.90, share: 0.70, sens: 0.60, curve: [[15, 0.044]] },
    { id: 'doctor',  age: 24, base: 130000, bonus: 0.60, share: 0.72, sens: 0.03, curve: [[2, 0.03], [15, 0.03]], jumpAt: 2, jump: 2.3 }
  ];
  E.prof = function (id) { for (var i = 0; i < E.PROFS.length; i++) if (E.PROFS[i].id === id) return E.PROFS[i]; return null; };

  function rng(seed) {            // mulberry32
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function lerpTable(tab, x) {   // tab: [[x, y], ...] sorted by x; linear, flat outside
    if (x <= tab[0][0]) return tab[0][1];
    for (var i = 1; i < tab.length; i++) if (x <= tab[i][0]) {
      var a = tab[i - 1], b = tab[i]; return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
    }
    return tab[tab.length - 1][1];
  }
  E.label = function (q) { var n = D.q0 - 1 + q; return { y: D.y0 + Math.floor(n / 4), k: n % 4 + 1 }; };
  function qi(y, k) { return (y - 1980) * 4 + k - 1; }   // quarter index; data start 1980Q1

  E.career = function (p, years) {
    var m = 1, prev = 0;
    for (var i = 0; i < p.curve.length; i++) {
      var until = p.curve[i][0], g = p.curve[i][1];
      var span = Math.min(years, until) - prev;
      if (span > 0) m *= Math.pow(1 + g, span);
      prev = until;
      if (years <= until) break;
    }
    if (p.jumpAt != null && years >= p.jumpAt) m *= p.jump;
    return m;
  };

  /* Income tax + resident tax as a share of annual pay, by law period (MOF tables, single person;
     1984–87 and 1995 figures shifted from family to single). Points above ¥8m are extrapolated. */
  var TAX = {
    A: [[1e6, 1.5], [2e6, 5.5], [3e6, 7.7], [5e6, 12.5], [8e6, 19.8], [12e6, 27], [20e6, 38], [40e6, 50]],   // to 1987Q3
    B: [[1e6, 0.8], [2e6, 4.5], [3e6, 5.1], [5e6, 8.0], [8e6, 11.7], [12e6, 17], [20e6, 25], [40e6, 36]],    // 1987Q4–1998
    C: [[1e6, 0.5], [2e6, 4.3], [3e6, 5.1], [5e6, 6.9], [8e6, 10.7], [12e6, 15], [20e6, 21], [40e6, 30]]     // 1999– (定率減税)
  };
  E.taxRate = function (annual, q) {
    var tab = q < qi(1987, 4) ? TAX.A : q < qi(1999, 1) ? TAX.B : TAX.C;
    return lerpTable(tab, annual) / 100;
  };
  /* Employee social insurance (pension + health + employment), % of regular pay and of bonuses.
     Before 2003 bonuses were mostly exempt (a 1% special levy from 1995). */
  var SOCIAL = [
    [0, 9.85, 0], [qi(1985, 4), 10.85, 0], [qi(1991, 1), 11.9, 0], [qi(1993, 2), 11.75, 0],
    [qi(1994, 4), 12.75, 0], [qi(1995, 2), 12.75, 1.0], [qi(1996, 4), 13.3, 1.0],
    [qi(2001, 2), 13.5, 1.0], [qi(2002, 4), 13.6, 1.0], [qi(2003, 2), 11.6, 11.6], [qi(2005, 1), 11.7, 11.7], [qi(2005, 4), 12.0, 12.0]
  ];
  E.social = function (q) { var r = SOCIAL[0]; for (var i = 0; i < SOCIAL.length; i++) if (q >= SOCIAL[i][0]) r = SOCIAL[i]; return { reg: r[1] / 100, bon: r[2] / 100 }; };

  /* Pay for one quarter. Bonuses are paid in the summer (Q2) and winter (Q4). */
  E.pay = function (s, q, t) {
    var p = E.prof(s.prof);
    if (q == null) q = s.q;
    if (t == null) t = s.t;
    var monthly = p.base * E.career(p, t / 4) * s.promo * D.wage[q] / D.wage[0];
    var months = D.bonus[q] * p.bonus;
    if (p.jumpAt != null && t / 4 < p.jumpAt) months = 0;          // residents get no bonus
    var k = E.label(q).k, bonusQ = (k === 2 || k === 4) ? monthly * months / 2 : 0;
    var regular = monthly * 3, annual = monthly * (12 + months);
    var tax = E.taxRate(annual, q), soc = E.social(q);
    var gross = regular + bonusQ;
    var net = gross * (1 - tax) - regular * soc.reg - bonusQ * soc.bon;
    var avgNet = annual / 4 * (1 - tax) - regular * soc.reg - months / 4 * monthly * soc.bon;
    return { gross: gross, net: net, regular: regular, bonus: bonusQ, monthly: monthly, annual: annual, avgNet: avgNet, months: months };
  };
  /* Unemployment benefit for a quarter: 60–80% of regular pay (50–80% from 2003), untaxed, with a daily cap. */
  E.benefit = function (s, q) {
    if (q == null) q = s.q;
    var pay = E.pay(s, q), q2000 = qi(2000, 2);
    var m2000 = pay.monthly * D.wage[q2000] / D.wage[q];
    var low = q >= qi(2003, 2) ? 0.5 : 0.6;
    var rate = m2000 <= 130000 ? 0.8 : m2000 >= 300000 ? low : 0.8 - (0.8 - low) * (m2000 - 130000) / 170000;
    var capDay = q >= qi(2003, 2) ? 7500 : 10000;                     // yen a day in 2000 money
    var cap = capDay * 91 * D.wage[q] / D.wage[q2000];
    return Math.min(rate * pay.regular, cap);
  };
  E.expenses = function (s, q) {
    if (q == null) q = s.q;
    return s.life * D.cpi[q] / D.cpi[s.start] * E.KIDS[s.kids];
  };
  E.intTax = function (q) { return q >= E.INT_TAX_FROM ? 0.20 : 0; };
  E.stockFee = function (q) { return q < qi(1999, 4) ? 0.012 : 0.005; };   // estimate: fixed commissions and transfer tax until Oct 1999
  E.GOLD_SPREAD = 0.03;                                                    // estimate: dealer buys back below its selling price

  /* Rental flats. A new flat costs D.house[q]; a flat bought earlier loses value and rent with age. */
  E.ageLoss = function (h, q) { return Math.max(0.4, 1 - E.AGE_LOSS * (q - h.bought) / 4); };
  E.rentQ = function (q, h) {
    var r = D.house[0] * E.RENT_YIELD / 4 * D.rent[q] / D.rent[0];
    return h ? r * Math.max(0.6, 1 - 0.01 * (q - h.bought) / 4) : r;
  };
  E.houseValue = function (h, q) { return D.house[q] * E.ageLoss(h, q); };
  E.mortPay = function (bal, rate) {
    var r = rate / 1200, n = E.LOAN_YEARS * 12;
    return 3 * bal * r / (1 - Math.pow(1 + r, -n));
  };
  function amortize(h) {
    var r = h.rate / 1200, m = h.pay / 3;
    for (var k = 0; k < 3; k++) { h.bal = Math.max(0, h.bal * (1 + r) - m); }
  }
  E.houseNet = function (h, q) { return E.rentQ(q, h) * E.RENT_KEEP - h.pay; };

  E.newGame = function (profId, seed, start) {
    var r = rng(seed);
    if (start == null) start = Math.floor(r() * (E.MAX_START + 1));
    var rolls = [];
    for (var i = 0; i < E.LEN; i++) rolls.push([r(), r(), r(), r()]);
    var p = E.prof(profId);
    var s = {
      prof: profId, seed: seed, start: start, t: 0, q: start,
      cash: 0, units: 0, oz: 0, houses: [], loan: null,
      employed: true, off: 0, promo: 1, kids: 0, life: 0, life0: 0, net0: 0,
      streak: 0, won: false, wonAt: null, over: false, bankrupt: false,
      rolls: rolls, hist: [], log: [], cost: { units: 0, oz: 0 }
    };
    var pay = E.pay(s);
    s.net0 = pay.avgNet;
    s.life0 = s.life = p.share * pay.avgNet;
    s.cash = Math.round(pay.avgNet * 0.5 / 1000) * 1000;
    s.hist.push(E.snapshot(s));
    return s;
  };

  E.netWorth = function (s) {
    var q = s.q, nw = s.cash + s.units * D.sp[q] + s.oz * D.gold[q];
    for (var i = 0; i < s.houses.length; i++) nw += E.houseValue(s.houses[i], q) - s.houses[i].bal;
    return nw;
  };
  E.passive = function (s) {
    var q = s.q;
    var interest = s.cash > 0 ? s.cash * D.tb[q] / 400 * (1 - E.intTax(q)) : 0;
    var div = s.units * D.div[q] / 4 * (1 - E.DIV_TAX);
    var rent = 0;
    for (var i = 0; i < s.houses.length; i++) rent += E.houseNet(s.houses[i], q);
    return { interest: interest, div: div, rent: rent, total: interest + div + rent };
  };
  E.required = function (s) { return E.expenses(s); };
  /* Goal of the Japan version: net worth covers GOAL_YEARS of living costs (貯蓄が生活費の何年分か).
     With deposit rates near zero after 1995, passive income could not cover expenses for anyone. */
  E.GOAL_YEARS = 10;
  E.cover = function (s) { return E.netWorth(s) / (E.expenses(s) * 4); };   // years of living costs saved
  E.freedom = function (s) { return E.cover(s) / E.GOAL_YEARS; };
  E.snapshot = function (s) {
    var nw = E.netWorth(s);
    return { t: s.t, nw: nw, real: nw * D.cpi[s.start] / D.cpi[s.q], free: E.freedom(s) };
  };

  /* ---------- player actions (at start-of-quarter prices) ---------- */
  E.buyStock = function (s, amount) {
    amount = Math.min(amount, s.cash); if (amount <= 0) return false;
    s.units += amount * (1 - E.stockFee(s.q)) / D.sp[s.q]; s.cash -= amount; s.cost.units += amount; return true;
  };
  E.sellStock = function (s, frac) {
    if (s.units <= 0) return false;
    var u = s.units * frac; s.cash += u * D.sp[s.q] * (1 - E.stockFee(s.q)); s.cost.units *= (1 - frac); s.units -= u;
    if (s.units < 1e-9) { s.units = 0; s.cost.units = 0; } return true;
  };
  E.goldOpen = function () { return true; };
  E.buyGold = function (s, amount) {
    amount = Math.min(amount, s.cash); if (amount <= 0) return false;
    s.oz += amount / D.gold[s.q]; s.cash -= amount; s.cost.oz += amount; return true;
  };
  E.sellGold = function (s, frac) {
    if (s.oz <= 0) return false;
    var o = s.oz * frac; s.cash += o * D.gold[s.q] * (1 - E.GOLD_SPREAD); s.cost.oz *= (1 - frac); s.oz -= o;
    if (s.oz < 1e-9) { s.oz = 0; s.cost.oz = 0; } return true;
  };
  E.houseQuote = function (s) {
    var q = s.q, price = D.house[q], rate = D.mort[q];
    var loan = price * (1 - E.DOWN), pay = E.mortPay(loan, rate);
    var need = price * (E.DOWN + E.CLOSING);
    var rent = E.rentQ(q), sumPay = pay;
    for (var i = 0; i < s.houses.length; i++) sumPay += s.houses[i].pay;
    var rentAll = rent; for (var j = 0; j < s.houses.length; j++) rentAll += E.rentQ(q, s.houses[j]);
    var limit = 0.30 * E.pay(s).annual / 4 + 0.75 * rentAll;
    var why = null;
    if (!s.employed) why = 'job';
    else if (s.cash < need) why = 'cash';
    else if (sumPay > limit) why = 'bank';
    return { price: price, rate: rate, loan: loan, pay: pay, need: need, rent: rent, net: rent * E.RENT_KEEP - pay, ok: !why, why: why, sumPay: sumPay, limit: limit };
  };
  E.buyHouse = function (s) {
    var k = E.houseQuote(s); if (!k.ok) return false;
    s.cash -= k.need;
    s.houses.push({ bought: s.q, price: k.price, bal: k.loan, rate: k.rate, pay: k.pay });
    return true;
  };
  E.houseSale = function (s, i) { var h = s.houses[i]; return E.houseValue(h, s.q) * (1 - E.SELL_COST) - h.bal; };
  E.sellHouse = function (s, i) {
    if (!s.houses[i]) return false;
    s.cash += E.houseSale(s, i); s.houses.splice(i, 1); return true;
  };
  E.refiQuote = function (s, i) {
    var h = s.houses[i], rate = D.mort[s.q], fee = h.bal * E.REFI_FEE;
    var pay = E.mortPay(h.bal, rate);
    return { rate: rate, fee: fee, pay: pay, saves: h.pay - pay, ok: rate <= h.rate - 1 && s.cash >= fee && h.bal > 0, offered: rate <= h.rate - 1 && h.bal > 0 };
  };
  E.refinance = function (s, i) {
    var k = E.refiQuote(s, i); if (!k.ok) return false;
    var h = s.houses[i]; s.cash -= k.fee; h.rate = k.rate; h.pay = k.pay; return true;
  };
  E.payLoan = function () { return false; };   // no student loans in this version

  var COSTS = 6, GAINS = 4;

  /* ---------- a turn: live through one quarter ---------- */
  E.step = function (s) {
    if (s.over) return null;
    var q = s.q, roll = s.rolls[s.t], p = E.prof(s.prof);
    var pay = E.pay(s), wasEmployed = s.employed;
    var f = {};
    f.salary = wasEmployed ? pay.net : E.benefit(s, q);
    f.bonus = wasEmployed ? pay.bonus : 0;
    f.expenses = E.expenses(s, q);
    f.interest = s.cash > 0 ? s.cash * D.tb[q] / 400 * (1 - E.intTax(q)) : s.cash * E.CARD_RATE / 400;
    f.div = s.units * D.div[q] / 4 * (1 - E.DIV_TAX);
    f.rent = 0;
    for (var i = 0; i < s.houses.length; i++) { f.rent += E.houseNet(s.houses[i], q); amortize(s.houses[i]); }
    f.event = 0;
    var notes = [];

    // a personal event
    var r = roll[1];
    if (r < 0.07) {
      f.event = -(0.25 + 0.45 * roll[2]) * f.expenses;
      notes.push({ kind: 'bad', key: 'cost' + Math.floor(roll[3] * COSTS), v: [-f.event] });
    } else if (r < 0.10) {
      f.event = (0.2 + 0.3 * roll[2]) * pay.avgNet;
      notes.push({ kind: 'good', key: 'gain' + Math.floor(roll[3] * GAINS), v: [f.event] });
    } else if (r < 0.125 && s.kids < 2 && s.t >= 4 && s.t < 36) {
      s.kids++;
      notes.push({ kind: 'life', key: 'baby', v: [Math.round((E.KIDS[s.kids] / E.KIDS[s.kids - 1] - 1) * 100)] });
    } else if (r < 0.14 && wasEmployed && s.t >= 4) {
      s.promo *= 1.05;
      notes.push({ kind: 'good', key: 'promo' });
    }

    // the job: layoff odds follow real unemployment; banks and brokers were failing in 1997–99
    if (wasEmployed) {
      var inResidency = p.jumpAt != null && s.t / 4 < p.jumpAt;
      var pj = clamp((D.un[q] - 1.0) * 0.006, 0.003, 0.04) * p.sens;
      if (p.bankRisk && q >= qi(1997, 4) && q <= qi(1999, 1)) pj += 0.04;
      if (!inResidency && s.t >= 2 && roll[0] < pj) {
        s.employed = false;
        s.off = 1 + (D.un[q] > 4 ? 1 : 0) + (roll[3] < 0.3 ? 1 : 0);
        notes.push({ kind: 'bad', key: p.bankRisk && q >= qi(1997, 4) && q <= qi(1999, 1) ? 'bankFail' : 'laidOff' });
      }
    } else {
      s.off--;
      if (s.off <= 0) { s.employed = true; s.promo *= E.REHIRE; notes.push({ kind: 'good', key: 'rehired' }); }
    }

    f.total = f.salary - f.expenses + f.interest + f.div + f.rent + f.event;
    s.cash += f.total;

    var prev = q;
    s.q = q + 1; s.t += 1;

    // lifestyle catches up with real pay growth
    var now = E.pay(s);
    var realNet = now.avgNet * D.cpi[s.start] / D.cpi[s.q];
    var target = s.life0 + E.CREEP * Math.max(0, realNet - s.net0);
    var lifeUp = false;
    if (target > s.life * 1.0005) { lifeUp = target > s.life * 1.15; s.life = target; }
    if (p.jumpAt != null && s.t / 4 === p.jumpAt) notes.push({ kind: 'good', key: 'residencyDone' });
    else if (lifeUp) notes.push({ kind: 'life', key: 'lifeUp' });

    // forced sale if consumer debt goes over the limit
    var limit = 2 * now.avgNet;
    if (s.cash < -limit) {
      if (s.oz > 0) { E.sellGold(s, 1); notes.push({ kind: 'bad', key: 'soldGold' }); }
      if (s.cash < -limit && s.units > 0) { E.sellStock(s, 1); notes.push({ kind: 'bad', key: 'soldStocks' }); }
      while (s.cash < -limit && s.houses.length) { E.sellHouse(s, 0); notes.push({ kind: 'bad', key: 'soldHouse' }); }
      if (s.cash < -limit) { s.over = true; s.bankrupt = true; notes.push({ kind: 'bad', key: 'bankrupt' }); }
    }

    var free = E.freedom(s);
    if (free >= 1) s.streak++; else s.streak = 0;
    if (!s.won && s.streak >= E.WIN_STREAK) { s.won = true; s.wonAt = s.t; }
    if (s.t >= E.LEN) s.over = true;
    s.hist.push(E.snapshot(s));

    var rep = {
      q: prev, t: s.t - 1, flows: f, notes: notes,
      d: {
        sp: D.sp[s.q] / D.sp[prev] - 1, gold: D.gold[s.q] / D.gold[prev] - 1,
        house: D.house[s.q] / D.house[prev] - 1, cpi: D.cpi[s.q] / D.cpi[prev] - 1
      }
    };
    s.log.push(rep);
    return rep;
  };

  /* ---------- simple strategies to compare against ---------- */
  E.BOTS = {
    deposit: { key: 'botDeposit', act: function () {} },
    stocks: { key: 'botStocks', act: function (s) { var keep = E.expenses(s); if (s.cash > keep) E.buyStock(s, s.cash - keep); } },
    houses: { key: 'botHouses', act: function (s) { var keep = E.expenses(s) * 0.5; var k = E.houseQuote(s); if (k.ok && s.cash - k.need > keep) E.buyHouse(s); } }
  };
  E.runBot = function (profId, seed, start, bot) {
    var s = E.newGame(profId, seed, start);
    while (!s.over) { bot.act(s); E.step(s); }
    return s;
  };

  root.Engine = E;
  if (typeof module !== 'undefined' && module.exports) module.exports = E;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

  function cls(x) { return Math.abs(x) < 0.5 ? '' : (x < 0 ? 'neg' : 'pos'); }
  function pct(x, d) { return (x * 100).toFixed(d == null ? 1 : d).replace('-', '−') + '%'; }
  function spct(x, d) { return (x >= 0 ? '+' : '') + pct(x, d); }
  function rate(v, d) { return v.toFixed(d == null ? 1 : d) + '%'; }
  function times(x) { return '×' + (x >= 10 ? x.toFixed(0) : x.toFixed(1)); }
  function ordinal(n) { var b = n % 100, a = n % 10; return n + ((b >= 11 && b <= 13) ? 'th' : a === 1 ? 'st' : a === 2 ? 'nd' : a === 3 ? 'rd' : 'th'); }
  function era(y) { return y < 1989 ? '昭和' + (y - 1925) + '年' : y === 1989 ? '平成元年' : '平成' + (y - 1988) + '年'; }
  function short(v) {
    var a = Math.abs(v), s = v < 0 ? '−' : '';

      if (a >= 1e4) return s + commas(Math.round(a / 1e4)) + '万';
      return s + commas(a);
    }
    if (a >= 1e6) return s + '¥' + (a / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (a >= 1e3) return s + '¥' + Math.round(a / 1e3) + 'k';
    return s + '¥' + commas(a);
  }
  function qKey(q) { var l = E.label(q); return l.y + 'Q' + l.k; }
  function row(label, value, c, tag) {
    return '<div class="row"><span>' + label + (tag ? '<span class="tag">' + tag + '</span>' : '') + '</span><span class="dots"></span><span class="num ' + (c || '') + '">' + value + '</span></div>';
  }
  function spark(arr) {
    if (arr.length < 2) arr = [arr[0], arr[0]];

    for (var i = 0; i < n; i++) {

  }
  function langToggle() {

  /* ---------- saving ---------- */

  function newOffer() { var seed = Math.floor(Math.random() * 2147483647) + 1; offer = { seed: seed, start: seed % (E.MAX_START + 1) }; }

  /* ---------- career picker ---------- */
  function viewStart() {
    var t = L();

    if (G && !G.over && !G.won) h += '<button class="btn" data-a="resume">' + t.resume(profName(G.prof), Math.floor(G.t / 4) + 1) + '</button>';
    h += '<section class="block"><h2>' + t.pick + '</h2><div class="profs">';
    var probe = { prof: null, promo: 1, start: offer.start };

      probe.prof = p.id;

      var risk = p.sens < 0.15 ? t.riskLow : p.sens < 1 ? t.riskMid : t.riskHigh;

      var months = D.bonus[offer.start] * p.bonus;
      h += '<button class="prof" data-a="pick" data-id="' + p.id + '"><span class="prof-name">' + profName(p.id) + '</span><span class="prof-pay">' + money(Math.round(pay.monthly / 100) * 100) + t.perMonth + '</span>' +
        '<span class="prof-note">' + PROF[lang][p.id][1] + ' ' + (p.jumpAt ? '' : t.bonusMonths(months)) + '</span><span class="prof-meta"><span>' + meta.join('</span><span>') + '</span></span></button>';
    });

  }
  function sources() { var t = L(); return '<details><summary>' + t.srcH + '</summary><ul><li>' + t.src.join('</li><li>') + '</li></ul></details>'; }

  /* ---------- game screen ---------- */
  function header() {
    var t = L(), p = E.prof(G.prof), yr = Math.floor(G.t / 4), age = p.age + yr;
    var h = '<header class="top"><div class="top-row"><span class="brand">' + t.title + ' · ' + t.sub + '</span><span class="when">' + t.yearOf(yr + 1) + ' · ' + t.qname[E.label(G.q).k - 1] + '</span></div>' +
      '<div class="top-row"><span class="who">' + profName(G.prof) + ', ' + t.age(age) + (G.employed ? '' : ' · <span class="neg">' + t.outOfWork + '</span>') + (G.kids ? ' · ' + t.kids(G.kids) : '') + '</span>' +
      '<span class="acts">' + langToggle() + '<button class="chip" data-a="quit">' + (askQuit ? t.sure : t.startOver) + '</button></span></div><div class="years" aria-hidden="true">';

  function wire() {

    }
    var rep = G.log[G.log.length - 1], n = NEWS[qKey(rep.q)];

    var mv = ['<span>' + t.prices + ' <b class="' + (rep.d.cpi > 0.02 ? 'neg' : '') + '">' + spct(rep.d.cpi) + '</b></span>',
      '<span>' + t.stocks + ' <b class="' + cls(rep.d.sp) + '">' + spct(rep.d.sp) + '</b></span>',

    return '<section class="wire"><div class="eyebrow">' + t.wire + '</div><div class="wire-head">' + head + '</div><div class="moves">' + mv.join('') + '</div><div class="notes">' + notes.join('') + '</div></section>';

  function flows() {

  function economy() {
    var t = L(), q = G.q;

      '<div><b>' + rate(D.infl[q]) + '</b><span>' + t.infl + '</span></div>' +

  }
  function chips(label, act, base, enabled) {
    var t = L(), h = '<div class="acts"><span>' + label + '</span>';

    });

  }
  function hist(arr) { return arr.slice(G.start, G.q + 1); }
  function chg(arr) { var t = L(); return G.q > G.start ? ' · ' + t.thisQ + ' <b class="' + cls(arr[G.q] / arr[G.q - 1] - 1) + '">' + spct(arr[G.q] / arr[G.q - 1] - 1) + '</b>' : ''; }
  function assets() {
    var t = L(), q = G.q, cash = G.cash, h = '<section class="block"><h2>' + t.whereH + '</h2>';
    // savings
    h += '<div class="asset"><div class="asset-head"><div><div class="asset-name">' + t.savings + '</div><div class="asset-price"><b>' + rate(D.tb[q], 2) + '</b>' + t.aYear + '</div></div>' + spark(hist(D.tb)) + '</div>';

    h += '</div>';
    // stocks
    var sv = G.units * D.sp[q];
    h += '<div class="asset"><div class="asset-head"><div><div class="asset-name">' + t.stocksN + '</div><div class="asset-price">' + t.index + ' <b>' + D.sp[q].toFixed(1) + '</b>' + chg(D.sp) + ' · ' + t.dividend + ' ' + rate(D.dy[q], 2) + '</div></div>' + spark(hist(D.sp)) + '</div>';
    h += sv > 0.5 ? '<div class="own">' + t.ownStocks(money(sv), money(G.cost.units), '<span class="' + cls(sv - G.cost.units) + '">' + spct(sv / G.cost.units - 1, 0) + '</span>') + '</div>' : '<div class="own muted">' + t.noStocks(rate(E.stockFee(q) * 100)) + '</div>';
    h += chips(t.buy, 'buyS', Math.max(0, cash), cash >= 1);
    if (sv > 0.5) h += chips(t.sell, 'sellS', sv, true);
    h += '</div>';
    // gold
    var gv = G.oz * D.gold[q];
    h += '<div class="asset"><div class="asset-head"><div><div class="asset-name">' + t.goldN + '</div><div class="asset-price"><b>' + money(D.gold[q]) + '</b>' + t.perGram + chg(D.gold) + '</div></div>' + spark(hist(D.gold)) + '</div>';
    h += gv > 0.5 ? '<div class="own">' + t.ownGold(money(gv), money(G.cost.oz), '<span class="' + cls(gv - G.cost.oz) + '">' + spct(gv / G.cost.oz - 1, 0) + '</span>') + '</div>' : '<div class="own muted">' + t.noGold(rate(E.GOLD_SPREAD * 100, 0)) + '</div>';

      row(t.downRow(Math.round(E.DOWN * 100)), money(k.need)) + row(t.loanRow(E.LOAN_YEARS), signed(-k.pay) + t.perQ, 'neg') + row(t.rentRow, signed(k.rent * E.RENT_KEEP) + t.perQ, 'pos') +
      '<div class="row sum"><span>' + t.netRow + '</span><span class="dots"></span><span class="num ' + cls(k.net) + '">' + signed(k.net) + t.perQ + '</span></div></div>' +
      '<div class="acts"><button class="btn" data-a="buyH"' + (k.ok ? '' : ' disabled') + '>' + t.buyFlat(money(k.need)) + '</button></div>' + (k.why ? '<div class="why">' + t.why[k.why] + '</div>' : '');

        row(t.worth, money(E.houseValue(hh, q))) + row(t.owed(rate(hh.rate, 2)), money(hh.bal)) + row(t.rentL, signed(net) + t.perQ, cls(net)) + '</div><div class="acts">' +
        '<button class="chip" data-a="sellH" data-i="' + i + '">' + t.sellFor(money(Math.abs(sale)), sale >= 0) + '</button>';

      h += '</div></div>';
    });
    return h + '</div></section>';
  }
  function viewPlay() {
    var t = L(), f = flows();

  /* ---------- results ---------- */
  function chart() {
    var H = G.hist, n = H.length - 1, W = 560, HT = 280, Lm = 92, R = 18, Tm = 14, B = 36;
    var vals = [0]; H.forEach(function (h) { vals.push(h.nw, h.real); });
    var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals); if (mx - mn < 1) mx = mn + 1;
    var raw = (mx - mn) / 4, mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10)), nm = raw / mag, stepv = (nm < 1.5 ? 1 : nm < 3 ? 2 : nm < 7 ? 5 : 10) * mag;
    var lo = Math.floor(mn / stepv) * stepv, hi = Math.ceil(mx / stepv) * stepv;
    function X(t) { return Lm + (n ? t / n : 0) * (W - Lm - R); }
    function Y(v) { return Tm + (hi - v) / (hi - lo) * (HT - Tm - B); }
    var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + HT + '" role="img" aria-label="' + L().chartH + '">';
    for (var v = lo; v <= hi + stepv / 2; v += stepv) s += '<line class="' + (Math.abs(v) < stepv / 10 ? 'zero' : 'grid') + '" x1="' + Lm + '" x2="' + (W - R) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '"/><text x="' + (Lm - 8) + '" y="' + (Y(v) + 5).toFixed(1) + '" text-anchor="end">' + short(v) + '</text>';
    for (var t = 0; t <= n; t++) { var l = E.label(G.start + t); if (l.k === 1 && l.y % 3 === 0 && X(t) < W - 30) s += '<line class="grid" x1="' + X(t).toFixed(1) + '" x2="' + X(t).toFixed(1) + '" y1="' + (HT - B) + '" y2="' + (HT - B + 6) + '"/><text x="' + X(t).toFixed(1) + '" y="' + (HT - 10) + '" text-anchor="middle">' + l.y + '</text>'; }
    var pr = H.map(function (h, i) { return X(i).toFixed(1) + ' ' + Y(h.real).toFixed(1); }), pn = H.map(function (h, i) { return X(i).toFixed(1) + ' ' + Y(h.nw).toFixed(1); });
    s += '<path class="real-a" d="M' + pr.join('L') + 'L' + X(n).toFixed(1) + ' ' + Y(0).toFixed(1) + 'L' + X(0).toFixed(1) + ' ' + Y(0).toFixed(1) + 'Z"/><path class="nom" d="M' + pn.join('L') + '"/><path class="real" d="M' + pr.join('L') + '"/><circle class="dot" r="4" cx="' + X(n).toFixed(1) + '" cy="' + Y(H[n].real).toFixed(1) + '"/>';
    return s + '</svg>';
  }
  function viewEnd() {
    var t = L(), last = G.hist[G.hist.length - 1], a = E.label(G.start), b = E.label(G.q), yrs = G.t / 4, cover = last.free * E.GOAL_YEARS;
    var title = G.bankrupt ? t.verdict.bankrupt : G.won ? t.verdict.won : last.free >= 0.75 ? t.verdict.almost : last.free >= 0.5 ? t.verdict.half : last.free >= 0.2 ? t.verdict.some : t.verdict.none;
    var dur = lang === 'ja' ? (yrs % 1 === 0 ? yrs : yrs.toFixed(2)) + '年' : (yrs % 1 === 0 ? yrs : yrs.toFixed(2)) + (yrs === 1 ? ' year' : ' years');
    var k = (D.cpi[G.q] / D.cpi[G.start]).toFixed(2);
    var head = '<section class="verdict"><div class="hero-top"><div class="eyebrow">' + t.result + ' · ' + profName(G.prof) + ' · ' + dur + '</div>' + langToggle() + '</div><h1>' + title + '</h1>';
    if (G.guess == null) {   // before the reveal: let the player guess the start year
      var ys = '';
      for (var y = E.label(0).y; y <= E.label(E.MAX_START).y; y++) ys += '<button class="chip" data-a="guess" data-y="' + y + '">' + y + '</button>';
      return head + '</section><section class="block"><h2>' + t.guessH + '</h2><div class="acts">' + ys + '<button class="chip" data-a="guess" data-y="0">' + t.skip + '</button></div></section>';
    }
    var off = Math.abs(G.guess - a.y), guessLine = G.guess ? (off === 0 ? t.guessExact : t.guessOff(G.guess, off)) : '';
    var h = head +
      '<div class="reveal">' + t.reveal(a.y, b.y, t.qname[a.k - 1], a.y) + (guessLine ? ' ' + guessLine : '') + '</div>' +
      '<p>' + (G.won ? t.wonText(Math.ceil(G.wonAt / 4)) : t.notWon(t.years(cover))) + t.nwText(money(last.nw), money(last.real), k) + '</p>' +
      '<div class="acts"><button class="btn" data-a="share">' + t.shareBtn + '</button><span class="hint" id="share-status" role="status"></span></div></section>';
    h += '<section class="block"><h2>' + t.chartH + '</h2><div class="legend"><span><i></i>' + t.legReal + '</span><span><i class="n"></i>' + t.legNom + '</span></div>' + chart() + '</section>';
    h += '<section class="block"><h2>' + t.cmpH + '</h2><div class="tbl-wrap"><table><thead><tr><th>' + t.strat + '</th><th class="num">' + t.safety + '</th><th class="num">' + t.nwStart + '</th></tr></thead><tbody>' +
      '<tr class="me"><td>' + t.you + '</td><td class="num">' + t.years(cover) + '</td><td class="num">' + money(last.real) + '</td></tr>';
    Object.keys(E.BOTS).forEach(function (id) {
      var s = E.runBot(G.prof, G.seed, G.start, E.BOTS[id]), x = s.hist[Math.min(G.t, s.hist.length - 1)];
      h += '<tr><td>' + t[E.BOTS[id].key] + (s.bankrupt && s.hist.length - 1 <= G.t ? t.bankruptTag : '') + '</td><td class="num">' + t.years(x.free * E.GOAL_YEARS) + '</td><td class="num">' + money(x.real) + '</td></tr>';
    });
    h += '</tbody></table></div></section>';
    var s0 = G.start, s1 = G.q, infl = D.cpi[s1] / D.cpi[s0], dep = 1, tr = 1;
    for (var q = s0; q < s1; q++) { dep *= 1 + D.tb[q] / 400 * (1 - E.intTax(q)); tr *= (D.sp[q + 1] + D.div[q] / 4 * (1 - E.DIV_TAX)) / D.sp[q]; }
    var rows = [dep, tr, D.house[s1] / D.house[s0], D.gold[s1] / D.gold[s0]];
    h += '<section class="block"><h2>' + t.yenH + '</h2><div class="tbl-wrap"><table><thead><tr><th>' + t.inv + '</th><th class="num">' + t.paper + '</th><th class="num">' + t.afterInfl + '</th></tr></thead><tbody>';
    rows.forEach(function (r, i) { h += '<tr><td>' + t.invRows[i] + '</td><td class="num">' + money(r * 10000) + '</td><td class="num ' + (r / infl < 1 ? 'neg' : 'pos') + '">' + money(r / infl * 10000) + '</td></tr>'; });
    h += '</tbody></table></div><div class="hint">' + t.yenHint(commas(infl * 10000)) + '</div></section>';
    h += '<section class="block"><h2>' + t.timeH + '</h2><div class="timeline">';
    G.log.forEach(function (rep) { var n = NEWS[qKey(rep.q)]; if (n) { var l = E.label(rep.q); h += '<div><b>' + (lang === 'ja' ? l.y + '年 ' + l.k + 'Q' : l.y + ' · Q' + l.k) + '</b><span>' + n[lang] + '</span></div>'; } });
    h += '</div></section>' + sources() + '<div class="dock"><div class="dock-in"><button class="btn" data-a="again">' + t.again + '</button></div></div>';
    return h;
  }

  /* ---------- sharing and visit counting ---------- */
  var URL_PLAY = 'https://malikabyl.github.io/in-someone-elses-shoes/japan/';
  function shareText() {
    var t = L(), last = G.hist[G.hist.length - 1], a = E.label(G.start), b = E.label(G.q), off = Math.abs(G.guess - a.y);
    var res = G.bankrupt ? t.shareBankrupt : G.won ? t.shareWon(Math.ceil(G.wonAt / 4)) : t.shareCover(t.years(last.free * E.GOAL_YEARS));
    var g = G.guess ? (off === 0 ? t.shareExact : t.shareOff(off)) : '';
    return t.shareText(profName(G.prof), a.y, b.y, res, g);
  }
  function share() {
    var t = L(), text = shareText(), status = document.getElementById('share-status');
    function say(m) { if (status) status.textContent = m; }
    function copy() {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text + ' ' + URL_PLAY).then(function () { say(t.copied); }, function () { say(t.copyThis + text + ' ' + URL_PLAY); });
      else say(t.copyThis + text + ' ' + URL_PLAY);
    }
    track('share');
    if (navigator.share) { navigator.share({ title: t.title + ' \u00b7 ' + t.sub, text: text, url: URL_PLAY }).catch(function (e) { if (e && e.name !== 'AbortError') copy(); }); return; }
    copy();
  }
  /* GoatCounter: counts visits and a few events, without cookies. Runs only on the public site. */
  var GC = 'https://malikabyl-shoes.goatcounter.com/count';
  function track(name) {
    try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: 'jp/' + name, title: name, event: true }); } catch (e) { /* counting is optional */ }
  }
  if (/\.github\.io$/.test(location.hostname)) {
    var gc = document.createElement('script'); gc.async = true; gc.src = 'https://gc.zgo.at/count.js'; gc.setAttribute('data-goatcounter', GC); document.head.appendChild(gc);
  }

  function render() {
    document.documentElement.lang = lang;
    document.title = T[lang].title + ' · ' + T[lang].sub;
    app.innerHTML = screen === 'play' && G ? viewPlay() : screen === 'end' && G ? viewEnd() : viewStart();
    save();
  }

  app.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-a]'); if (!b || b.disabled) return;
    var a = b.dataset.a, f = parseFloat(b.dataset.f), i = parseInt(b.dataset.i, 10), done = false, top = false;
    if (a !== 'quit') askQuit = false;
    if (a === 'lang') { lang = b.dataset.l; track('lang-' + lang); try { localStorage.setItem(LANGKEY, lang); } catch (e) { /* language just won't be remembered */ } }
    else if (a === 'guess') { G.guess = parseInt(b.dataset.y, 10) || 0; track('guess'); top = true; }
    else if (a === 'share') { share(); return; }
    else if (a === 'pick') { G = E.newGame(b.dataset.id, offer.seed, offer.start); screen = 'play'; markTurn(); top = true; track('start-' + b.dataset.id); }
    else if (a === 'resume') { screen = 'play'; markTurn(); top = true; }
    else if (a === 'again') { G = null; newOffer(); screen = 'start'; top = true; }
    else if (a === 'quit') { if (askQuit) { askQuit = false; G = null; newOffer(); screen = 'start'; top = true; } else askQuit = true; }
    else if (a === 'undo') { G = JSON.parse(turnStart); dirty = false; }
    else if (a === 'next') { E.step(G); if (G.won || G.over) { screen = 'end'; track(G.won ? 'end-won' : 'end'); } markTurn(); top = true; }
    else if (a === 'buyS') done = E.buyStock(G, G.cash * f);
    else if (a === 'sellS') done = E.sellStock(G, f);
    else if (a === 'buyG') done = E.buyGold(G, G.cash * f);
    else if (a === 'sellG') done = E.sellGold(G, f);
    else if (a === 'buyH') done = E.buyHouse(G);
    else if (a === 'sellH') done = E.sellHouse(G, i);
    else if (a === 'refi') done = E.refinance(G, i);
    if (done) dirty = true;
    render();
    if (top) window.scrollTo(0, 0);
  });

  function boot(data) {
    if (data && data.offer) { G = data.G; screen = data.screen; offer = data.offer; } else load();
    if (!offer) newOffer();
    if (!G && screen !== 'start') screen = 'start';
    if (G && screen === 'play') markTurn();
    render();
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(function () { return { G: G, screen: screen, offer: offer }; });
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
