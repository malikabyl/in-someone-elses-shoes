name: MCP engine checks
on:
  pull_request:
    paths:
      - 'mcp-worker/**'
  push:
    paths:
      - 'mcp-worker/**'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
